name: fido2_plugin
description: "FIDO2 security key assertions over NFC: yubikit-android on Android, iOS pending."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.defguard.fido2_plugin
        pluginClass: Fido2Plugin
      ios:
        pluginClass: Fido2Plugin
