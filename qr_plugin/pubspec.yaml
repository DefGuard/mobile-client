name: qr_plugin
description: "Native QR code scanner: CameraX + ML Kit on Android, AVFoundation on iOS."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.defguard.qr_plugin
        pluginClass: QrPlugin
      ios:
        pluginClass: QrPlugin
