org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
android.builtInKotlin=false


# Cronet (via cronet_http -> native_dio_adapter) ships `cronet-api` and
# `cronet-shared` with the same `org.chromium.net` namespace. AGP 9 flipped
# `uniquePackageNames` to true, which rejects that. The namespace collision is a
# tooling-level check, not a runtime problem, and it cannot be fixed in a
# third-party AAR. Do NOT "fix" this by excluding `cronet-shared` instead:
# `org.chromium.base.*` (e.g. ScopedSysTraceEvent) lives there and Cronet loads
# it dynamically, so excluding it builds fine and then dies at runtime with
# NoClassDefFoundError on the first request.
android.uniquePackageNames=false
