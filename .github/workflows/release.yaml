name: "Release"

on:
  workflow_call:

jobs:
  create-release:
    runs-on: self-hosted
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          draft: true
          files: |
            ./artifacts/Defguard.ipa
            ./artifacts/Defguard.aab
            ./artifacts/Defguard.apk

  create-sbom:
    needs: [create-release]
    uses: ./.github/workflows/sbom.yaml
    with:
      upload_url: ${{ needs.create-release.outputs.upload_url }}
