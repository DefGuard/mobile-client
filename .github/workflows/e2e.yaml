name: Mobile E2E tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: mobile-e2e

jobs:
  e2e-android:
    runs-on: [self-hosted, macOS, native]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: tools platform-tools build-tools;36.0.0 platforms;android-37.0 ndk;28.2.13676358

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.27
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          STORE_PATH=$(pnpm store path --silent)
          mkdir -p "$STORE_PATH"
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-mobile-e2e-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-mobile-e2e-${{ runner.os }}-

      - name: Prepare e2e environment
        run: |
          cp .env.example .env
          echo "ANDROID_AVD=test" >> .env
        working-directory: e2e

      - name: Check deployment is reachable
        run: curl -sf --max-time 15 "${{ secrets.E2E_CORE_URL }}/api/v1/health"

      - name: Build debug apk
        run: |
          flutter pub get
          flutter build apk --debug
        working-directory: client

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      - name: Install Appium Android driver
        run: APPIUM_HOME="$HOME/.appium" pnpm appium:driver:android
        working-directory: e2e

      - name: Disable emulator console auth
        run: ': > "$HOME/.emulator_console_auth_token"'

      - name: Run Android E2E on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CORE_URL: ${{ secrets.E2E_CORE_URL }}
          PROXY_URL: ${{ secrets.E2E_PROXY_URL }}
          CORE_ADMIN_PASSWORD: ${{ secrets.E2E_CORE_ADMIN_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim
          script: cd "$GITHUB_WORKSPACE/e2e" && { pnpm test:android --logLevel warn || { tail -n 80 logs/wdio-appium.log; exit 1; }; }

  e2e-ios:
    needs: [e2e-android]
    if: success() || failure()
    runs-on: [self-hosted, macOS, native]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.27
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          STORE_PATH=$(pnpm store path --silent)
          mkdir -p "$STORE_PATH"
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-mobile-e2e-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-mobile-e2e-${{ runner.os }}-

      - name: Prepare e2e environment
        run: cp .env.example .env
        working-directory: e2e

      - name: Check deployment is reachable
        run: curl -sf --max-time 15 "${{ secrets.E2E_CORE_URL }}/api/v1/health"

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install deps
        run: flutter pub get
        working-directory: client

      - name: Create BoringTun directory
        run: mkdir -p ios/VPNExtension/BoringTun
        working-directory: client

      - name: Generate boringtun bindings
        run: cd ios/boringtun && ./bindings.sh
        working-directory: client

      - name: Build iOS simulator app
        run: flutter build ios --simulator
        working-directory: client

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      - name: Install Appium iOS driver
        run: APPIUM_HOME="$HOME/.appium" pnpm appium:driver:ios
        working-directory: e2e

      - name: Run iOS E2E on simulator
        run: pnpm test:ios --logLevel warn
        working-directory: e2e
        env:
          CORE_URL: ${{ secrets.E2E_CORE_URL }}
          PROXY_URL: ${{ secrets.E2E_PROXY_URL }}
          CORE_ADMIN_PASSWORD: ${{ secrets.E2E_CORE_ADMIN_PASSWORD }}

  lint-e2e:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.27
          run_install: false

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      - name: Lint e2e
        run: pnpm lint
        working-directory: e2e

      - name: Typecheck e2e
        run: pnpm typecheck
        working-directory: e2e
