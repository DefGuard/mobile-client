name: Run Flutter Lint and Tests

env:
  IOS_SIMULATOR: "iPhone 17 Pro"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
      - "hotfix/**"
    paths-ignore: &ignored_paths
      - "*.md"
      - "LICENSE"
      - "flake.*"
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
      - "hotfix/**"
    paths-ignore: *ignored_paths

jobs:
  lint:
    name: Lint and test
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"

      - name: Scan code with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: get deps
        run: flutter pub get

      - name: check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: run lint
        run: flutter analyze

  lint-qr-plugin:
    name: Lint qr_plugin
    runs-on: [self-hosted, Linux, X64]
    env:
      KTLINT_VERSION: "1.8.0"
    defaults:
      run:
        working-directory: ./qr_plugin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: get deps
        run: flutter pub get

      - name: check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: run lint
        run: flutter analyze

      - name: run ktlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "android/**/*.kt"

  lint-plugins-swift:
    name: Lint plugins Swift
    runs-on: [self-hosted, macOS, native]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: run swift-format
        run: xcrun swift-format lint --strict --recursive qr_plugin/ios wireguard_plugin/darwin

  flutter-test:
    name: Run Flutter tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: get deps
        run: flutter pub get

      - name: run tests
        run: flutter test

  fido2-plugin-test:
    name: Run fido2_plugin tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./fido2_plugin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: get deps
        run: flutter pub get

      - name: run tests
        run: flutter test

  test-android:
    name: Run Android plugin tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-36 platforms;android-37.0 ndk;28.2.13676358

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Configure Flutter JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: get deps
        run: flutter pub get

      - name: Generate Gradle config
        run: flutter build apk --config-only

      - name: run plugin tests
        run: ./gradlew :wireguard_plugin:testDebugUnitTest
        working-directory: ./client/android

  test-ios:
    name: Run iOS tests
    runs-on: [self-hosted, macOS, native]
    needs: lint
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: get deps
        run: flutter pub get

      - name: Create BoringTun directory
        run: mkdir -p ios/VPNExtension/BoringTun

      - name: Generate boringtun bindings
        run: cd ios/boringtun && ./bindings.sh

      - name: Generate Xcode config
        run: flutter build ios --simulator --config-only

      - name: run plugin tests
        run: xcodebuild test -workspace Runner.xcworkspace -scheme Runner -sdk iphonesimulator -destination "platform=iOS Simulator,name=$IOS_SIMULATOR"
        working-directory: ./client/ios
