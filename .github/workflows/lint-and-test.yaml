name: Run Flutter Lint and Tests

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
      - "hotfix/**"
    paths-ignore: &ignored_paths
      - "*.md"
      - "LICENSE"
      - "flake.*"
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
      - "hotfix/**"
    paths-ignore: *ignored_paths

jobs:
  lint:
    name: Lint and test
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Scan code with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: get deps
        run: flutter pub get

      - name: check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: run lint
        run: flutter analyze

  lint-qr-plugin:
    name: Lint qr_plugin
    runs-on: [self-hosted, Linux, X64]
    env:
      KTLINT_VERSION: "1.8.0"
    defaults:
      run:
        working-directory: ./qr_plugin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: get deps
        run: flutter pub get

      - name: check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: run lint
        run: flutter analyze

      - name: run ktlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "android/**/*.kt"

  lint-qr-plugin-swift:
    name: Lint qr_plugin Swift
    runs-on: [self-hosted, macOS, native]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: run swift-format
        run: xcrun swift-format lint --strict --recursive qr_plugin/ios

  flutter-test:
    name: Run Flutter tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: get deps
        run: flutter pub get

      - name: run tests
        run: flutter test

