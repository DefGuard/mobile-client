name: Run Flutter Lint and Tests

env:
  IOS_SIMULATOR: "iPhone 18 Pro"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
      - "hotfix/**"
    paths-ignore: &ignored_paths
      - "*.md"
      - "LICENSE"
      - "flake.*"
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
      - "hotfix/**"
    paths-ignore: *ignored_paths

jobs:
  lint:
    name: Lint and test
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"

      - name: Scan code with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: get deps
        run: flutter pub get

      - name: check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: run lint
        run: flutter analyze

  lint-qr-plugin:
    name: Lint qr_plugin
    runs-on: [self-hosted, Linux, X64]
    env:
      KTLINT_VERSION: "1.8.0"
    defaults:
      run:
        working-directory: ./qr_plugin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Set up Java
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: get deps
        run: flutter pub get

      - name: check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: run lint
        run: flutter analyze

      - name: run ktlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "android/**/*.kt"

  lint-plugins-swift:
    name: Lint plugins Swift
    runs-on: [self-hosted, macOS, native]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: run swift-format
        run: xcrun swift-format lint --strict --recursive qr_plugin/ios wireguard_plugin/darwin

  flutter-test:
    name: Run Flutter tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: get deps
        run: flutter pub get

      - name: run tests
        run: flutter test

  fido2-plugin-test:
    name: Run fido2_plugin tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./fido2_plugin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: get deps
        run: flutter pub get

      - name: run tests
        run: flutter test

  device-identity-plugin-test:
    name: Run device identity plugin tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./client/lib/enterprise/device_identity_plugin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Get dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  test-android:
    name: Run Android plugin tests
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-36 platforms;android-37.0 ndk;28.2.13676358

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Configure Flutter JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: get deps
        run: flutter pub get

      - name: Generate Gradle config
        run: flutter build apk --config-only

      - name: run plugin tests
        run: ./gradlew :wireguard_plugin:testDebugUnitTest
        working-directory: ./client/android

  device-identity-android-test:
    name: Run device identity instrumented tests
    runs-on: [self-hosted, macOS, native]
    needs: [lint, device-identity-plugin-test]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Checkout keyattestation verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: android/keyattestation
          ref: 621149c4ebaeeea844d6f43098687c73c4d370a3
          path: keyattestation
      - name: Set up Java 21 for verifier build
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Build keyattestation verifier
        run: |
          mkdir -p "$RUNNER_TEMP/keyattestation-m2"
          cd "$GITHUB_WORKSPACE/keyattestation"
          ./gradlew \
            -PkeyAttestationReleaseVersion=v0.4 \
            "-PKeyAttestationMavenRepo=$RUNNER_TEMP/keyattestation-m2" \
            publishKeyattestationPublicationToLocalDirRepository
      - name: Set up Java 25 for client Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: tools platform-tools build-tools;36.0.0 platforms;android-37.0 ndk;28.2.13676358
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Configure Flutter JDK
        run: flutter config --jdk-dir "$JAVA_HOME"
      - name: Get client dependencies
        run: flutter pub get
        working-directory: ./client
      - name: Generate Gradle config
        run: flutter build apk --config-only
        working-directory: ./client
      - name: Disable emulator console auth
        run: ': > "$HOME/.emulator_console_auth_token"'
      - name: Run API 34 emulator tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim
          script: >-
            cd "$GITHUB_WORKSPACE/client/android" && ./gradlew
            --project-cache-dir="$RUNNER_TEMP/gradle-project-cache"
            "-PkeyAttestationMavenRepo=$RUNNER_TEMP/keyattestation-m2"
            :device_identity_plugin:connectedDebugAndroidTest

  test-ios:
    name: Run iOS tests
    runs-on: [self-hosted, macOS, native]
    needs: lint
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"

      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: get deps
        run: flutter pub get

      - name: Create BoringTun directory
        run: mkdir -p ios/VPNExtension/BoringTun

      - name: Generate boringtun bindings
        run: cd ios/boringtun && ./bindings.sh

      - name: Generate Xcode config
        run: flutter build ios --simulator --config-only

      - name: run plugin tests
        run: xcodebuild test -workspace Runner.xcworkspace -scheme Runner -sdk iphonesimulator -destination "platform=iOS Simulator,name=$IOS_SIMULATOR"
        working-directory: ./client/ios
